[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tv-automation-platform"
version = "0.1.0"
description = "Android TV automation core, pytest workflows and local platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6,<7",
    "uiautomator2>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools.packages.find]
include = ["automation_core*", "workflows*", "backend*", "agent_harness*"]
namespaces = false

[tool.setuptools.package-data]
"automation_core.ai" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "unit_tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = '-ra -m "not device and not ai"'
markers = [
    "device: requires a connected Android device or Android TV",
    "ai: requires an AI provider and valid credentials",
]
